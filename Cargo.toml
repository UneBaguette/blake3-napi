
[package]
edition = "2024"
name = "blake3-napi"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
blake3 = { version = "1.8.4", features = ["rayon"] }
napi = "3.8.4"
napi-derive = "3.8.4"
rayon = "1.12.0"

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = 3
lto = true
strip = "symbols"
